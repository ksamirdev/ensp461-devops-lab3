# ponytail: runs as root with the Docker socket and no login, acceptable only on this localhost-bound lab machine
name: lab3-pipeline

services:
  jenkins:
    build: .
    user: root
    ports: ["127.0.0.1:8390:8080"]
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-home:
